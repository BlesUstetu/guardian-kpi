<script>

function loadDashboard(){

google.script.run

.withSuccessHandler(function(res){

document.getElementById("totalAnggota").innerHTML=res.totalAnggota;

document.getElementById("totalGroup").innerHTML=res.totalGroup;

document.getElementById("totalKPI").innerHTML=res.totalKPI;

document.getElementById("averageKPI").innerHTML=res.averageKPI+"%";

})

.getDashboard();

}

document.addEventListener("DOMContentLoaded",loadDashboard);

</script>

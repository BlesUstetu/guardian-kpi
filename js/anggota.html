<script>

/* ==========================================
   Guardian KPI Web3
   File : js/anggota.html
   ========================================== */

let anggotaData = [];
let groupData = [];

/* ==========================================
   LOAD GROUP
========================================== */

function loadGroup() {

    google.script.run

        .withSuccessHandler(function(data) {

            groupData = data;

            const select = document.getElementById("group");

            if (!select) return;

            select.innerHTML = '<option value="">Pilih Group</option>';

            data.forEach(function(item) {

                select.innerHTML += `
                    <option value="${item.id}">
                        ${item.nama}
                    </option>
                `;

            });

        })

        .withFailureHandler(function(err) {

            alert(err.message);

        })

        .getGroup();

}

/* ==========================================
   LOAD ANGGOTA
========================================== */

function loadAnggota() {

    google.script.run

        .withSuccessHandler(function(data) {

            anggotaData = data;

            renderTable(data);

        })

        .withFailureHandler(function(err) {

            alert(err.message);

        })

        .getAnggota();

}

/* ==========================================
   RENDER TABLE
========================================== */

function renderTable(data) {

    const tbody = document.getElementById("tblAnggota");

    if (!tbody) return;

    if (data.length === 0) {

        tbody.innerHTML = `
            <tr>
                <td colspan="6" class="text-center">
                    Tidak ada data.
                </td>
            </tr>
        `;

        return;

    }

    let html = "";

    data.forEach(function(item) {

        let badge = item.status === "Aktif"
            ? "bg-success"
            : "bg-danger";

        html += `

        <tr>

            <td>${item.id}</td>

            <td>${item.nama}</td>

            <td>${item.jabatan}</td>

            <td>${getGroupName(item.group)}</td>

            <td>

                <span class="badge ${badge}">

                    ${item.status}

                </span>

            </td>

            <td>

                <button
                    class="btn btn-warning btn-sm"
                    onclick="editAnggota('${item.id}')">

                    <i class="bi bi-pencil"></i>

                </button>

                <button
                    class="btn btn-danger btn-sm"
                    onclick="hapusAnggota('${item.id}')">

                    <i class="bi bi-trash"></i>

                </button>

            </td>

        </tr>

        `;

    });

    tbody.innerHTML = html;

}

/* ==========================================
   GET GROUP NAME
========================================== */

function getGroupName(id) {

    const item = groupData.find(g => g.id === id);

    return item ? item.nama : "-";

}

/* ==========================================
   SEARCH & FILTER
========================================== */

function filterAnggota() {

    const keyword = document
        .getElementById("searchAnggota")
        .value
        .toLowerCase();

    const status = document
        .getElementById("filterStatus")
        .value;

    const result = anggotaData.filter(function(item) {

        const cocokNama =
            item.nama.toLowerCase().includes(keyword);

        const cocokStatus =
            status === "" || item.status === status;

        return cocokNama && cocokStatus;

    });

    renderTable(result);

}

/* ==========================================
   SAVE
========================================== */

function saveAnggota() {

    const data = {

        nama: document.getElementById("nama").value.trim(),

        jabatan: document.getElementById("jabatan").value,

        group: document.getElementById("group").value,

        status: document.getElementById("status").value

    };

    google.script.run

        .withSuccessHandler(function(res) {

            alert(res.message);

            const modal = bootstrap.Modal.getInstance(
                document.getElementById("anggotaModal")
            );

            if (modal) {
                modal.hide();
            }

            clearForm();

            loadAnggota();

        })

        .withFailureHandler(function(err) {

            alert(err.message);

        })

        .saveAnggota(data);

}

/* ==========================================
   EDIT
========================================== */

function editAnggota(id) {

    alert("Fitur Edit akan dibuat pada Sprint berikutnya.");

}

/* ==========================================
   DELETE
========================================== */

function hapusAnggota(id) {

    if (!confirm("Yakin ingin menghapus anggota ini?")) {
        return;
    }

    google.script.run

        .withSuccessHandler(function(res) {

            alert(res.message);

            loadAnggota();

        })

        .withFailureHandler(function(err) {

            alert(err.message);

        })

        .deleteAnggota(id);

}

/* ==========================================
   CLEAR FORM
========================================== */

function clearForm() {

    document.getElementById("nama").value = "";

    document.getElementById("jabatan").selectedIndex = 0;

    document.getElementById("group").selectedIndex = 0;

    document.getElementById("status").selectedIndex = 0;

}

/* ==========================================
   INIT
========================================== */

document.addEventListener("DOMContentLoaded", function() {

    loadGroup();

    loadAnggota();

});

</script>

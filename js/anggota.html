<script>

function loadAnggota(){

google.script.run

.withSuccessHandler(showAnggota)

.getAnggota();

}

function showAnggota(data){

let html="";

data.forEach(item=>{

html+=`

<tr>

<td>${item.id}</td>

<td>${item.nama}</td>

<td>${item.jabatan}</td>

<td>${item.group}</td>

<td>${item.status}</td>

<td>

<button>Edit</button>

<button>Hapus</button>

</td>

</tr>

`;

});

document.getElementById("tblAnggota").innerHTML=html;

}

</script>

<div class="container-fluid">

    <!-- =======================================
         HEADER
    ======================================== -->

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>

            <h2 class="fw-bold text-info">

                Penilaian KPI

            </h2>

            <small class="text-secondary">

                Kelola Penilaian KPI Anggota Security.

            </small>

        </div>

        <button
            class="btn btn-info"
            onclick="openPenilaianModal()">

            <i class="bi bi-plus-circle"></i>

            Penilaian Baru

        </button>

    </div>

</div>

<!-- =======================================
     CARD
======================================= -->

<div class="card-glass">

    <!-- Toolbar -->

    <div class="row mb-3">

        <!-- Search -->

        <div class="col-md-3">

            <input
                id="searchPenilaian"
                type="text"
                class="form-control"
                placeholder="Cari Anggota..."
                onkeyup="filterPenilaian()">

        </div>

        <!-- Bulan -->

        <div class="col-md-2">

            <select
                id="filterBulan"
                class="form-select"
                onchange="filterPenilaian()">

                <option value="">

                    Semua Bulan

                </option>

                <option value="1">Januari</option>
                <option value="2">Februari</option>
                <option value="3">Maret</option>
                <option value="4">April</option>
                <option value="5">Mei</option>
                <option value="6">Juni</option>
                <option value="7">Juli</option>
                <option value="8">Agustus</option>
                <option value="9">September</option>
                <option value="10">Oktober</option>
                <option value="11">November</option>
                <option value="12">Desember</option>

            </select>

        </div>

        <!-- Tahun -->

        <div class="col-md-2">

            <select
                id="filterTahun"
                class="form-select"
                onchange="filterPenilaian()">

                <option value="">

                    Semua Tahun

                </option>

            </select>

        </div>

        <!-- Status -->

        <div class="col-md-2">

            <select
                id="filterStatusPenilaian"
                class="form-select"
                onchange="filterPenilaian()">

                <option value="">

                    Semua Status

                </option>

                <option value="Draft">

                    Draft

                </option>

                <option value="Final">

                    Final

                </option>

            </select>

        </div>

        <!-- Refresh -->

        <div class="col-md-3 text-end">

            <button
                class="btn btn-outline-info"
                onclick="refreshPenilaian()">

                <i class="bi bi-arrow-clockwise"></i>

                Refresh

            </button>

        </div>

    </div>

  <!-- =======================================
     TABLE
======================================= -->

<div class="table-responsive">

    <table class="table table-dark table-hover align-middle">

        <thead>

            <tr>

                <th width="90">

                    ID

                </th>

                <th>

                    Nama Anggota

                </th>

                <th width="150">

                    Group

                </th>

                <th width="120">

                    Bulan

                </th>

                <th width="100">

                    Tahun

                </th>

                <th width="120">

                    Nilai

                </th>

                <th width="120">

                    Status

                </th>

                <th width="150">

                    Aksi

                </th>

            </tr>

        </thead>

        <tbody id="tblPenilaian">

            <tr>

                <td colspan="8" class="text-center">

                    Memuat data...

                </td>

            </tr>

        </tbody>

    </table>

</div>

</div>

<!-- =======================================
     MODAL PENILAIAN
======================================= -->

<div
class="modal fade"
id="penilaianModal"
tabindex="-1"
data-bs-backdrop="static">

<div class="modal-dialog modal-xl">

<div class="modal-content bg-dark text-white">

<div class="modal-header">

<h5 class="modal-title">

Penilaian KPI

</h5>

<button
class="btn-close btn-close-white"
data-bs-dismiss="modal">

</button>

</div>

<div class="modal-body">

<div class="row">

<div class="col-md-4">

<label class="form-label">

Anggota

</label>

<select
id="anggotaPenilaian"
class="form-select">

<option value="">

Pilih Anggota

</option>

</select>

</div>

<div class="col-md-4">

<label class="form-label">

Bulan

</label>

<select
id="bulanPenilaian"
class="form-select">

<option value="1">Januari</option>
<option value="2">Februari</option>
<option value="3">Maret</option>
<option value="4">April</option>
<option value="5">Mei</option>
<option value="6">Juni</option>
<option value="7">Juli</option>
<option value="8">Agustus</option>
<option value="9">September</option>
<option value="10">Oktober</option>
<option value="11">November</option>
<option value="12">Desember</option>

</select>

</div>

<div class="col-md-4">

<label class="form-label">

Tahun

</label>

<select
id="tahunPenilaian"
class="form-select">

</select>

</div>

</div>

<hr>

<div id="listIndikator">

<!-- Dibuat otomatis oleh JavaScript -->

</div>

<hr>

<div class="row">

<div class="col-md-4">

<label class="form-label">

Total Nilai

</label>

<input
id="totalNilai"
class="form-control"
readonly>

</div>

<div class="col-md-4">

<label class="form-label">

Nilai Akhir

</label>

<input
id="nilaiAkhir"
class="form-control"
readonly>

</div>

<div class="col-md-4">

<label class="form-label">

Status

</label>

<select
id="statusPenilaian"
class="form-select">

<option value="Draft">

Draft

</option>

<option value="Final">

Final

</option>

</select>

</div>

</div>

</div>

<div class="modal-footer">

<button
class="btn btn-secondary"
data-bs-dismiss="modal">

Batal

</button>

<button
id="btnSavePenilaian"
class="btn btn-info"
onclick="savePenilaian()">

<i class="bi bi-save"></i>

<span>Simpan</span>

</button>

</div>

</div>

</div>

</div>

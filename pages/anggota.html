        background: rgba(0, 217, 255, .06);
        color: #00d9ff;

        cursor: pointer;
        transition:

            border-color .2s ease,
            transform .2s ease,

    }

    .anggota-btn:hover {

    .anggota-btn:disabled {

       ========================================================== */

    .anggota-stat-grid {

        margin-bottom: 18px;

    .anggota-stat {

        top: -45px;
        border-radius: 50%;
        background: rgba(0,217,255,.07);
        pointer-events: none;
    }

    .anggota-stat-label {

        z-index: 1;

<script>
/*
 * ==========================================================
 * ANGGOTA PAGE INITIALIZER
 * ==========================================================
 *
 * Halaman dimuat secara dinamis oleh app.js.
 *
 * Jangan menggunakan:
 *
 *     DOMContentLoaded
 *
 * karena event tersebut sudah lewat ketika halaman ini
 * dimasukkan ke dalam #app.
 *
 * app.js akan memanggil:
 *
 *     initAnggota()
 *
 * ==========================================================
 */

(function () {

    function updateAnggotaCounters() {

        if (
            typeof anggotaData === "undefined" ||
            !Array.isArray(anggotaData)
        ) {
            return;
        }

        const total =
            anggotaData.length;

        const aktif =
            anggotaData.filter(function (item) {

                return String(item.status || "")
                    .trim()
                    .toLowerCase() === "aktif";

            }).length;

        const nonaktif =
            total - aktif;


        const totalEl =
            document.getElementById(
                "totalAnggota"
            );

        const aktifEl =
            document.getElementById(
                "totalAnggotaAktif"
            );

        const nonaktifEl =
            document.getElementById(
                "totalAnggotaNonAktif"
            );


        if (totalEl) {
            totalEl.textContent = total;
        }

        if (aktifEl) {
            aktifEl.textContent = aktif;
        }

        if (nonaktifEl) {
            nonaktifEl.textContent = nonaktif;
        }

    }


    /*
     * Patch renderAnggota agar counter ikut
     * diperbarui setelah data selesai dirender.
     */

    if (
        typeof window.renderAnggota === "function"
    ) {

        const originalRender =
            window.renderAnggota;

        window.renderAnggota =
            function (data) {

                originalRender(data);

                updateAnggotaCounters();

            };

    }


    /*
     * Jika fungsi init dipanggil oleh app.js,
     * loadAnggota akan mengambil data.
     */

})();
</script>

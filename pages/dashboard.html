<div class="container-fluid">

    <!-- Header -->

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>

            <h2 class="fw-bold text-info">

                Dashboard

            </h2>

            <small class="text-secondary">

                Guardian KPI Web3 Dashboard

            </small>

        </div>

        <button
            class="btn btn-info"
            onclick="init()">

            <i class="bi bi-arrow-clockwise"></i>

            Refresh

        </button>

    </div>

    <!-- KPI CARD -->

    <div class="row g-3">

        <div class="col-lg-3 col-md-6">

            <div class="card-glass">

                <small>Total Anggota</small>

                <h2 id="totalAnggota">

                    ...

                </h2>

            </div>

        </div>

        <div class="col-lg-3 col-md-6">

            <div class="card-glass">

                <small>Total Group</small>

                <h2 id="totalGroup">

                    ...

                </h2>

            </div>

        </div>

        <div class="col-lg-3 col-md-6">

            <div class="card-glass">

                <small>Total KPI</small>

                <h2 id="totalKPI">

                    ...

                </h2>

            </div>

        </div>

        <div class="col-lg-3 col-md-6">

            <div class="card-glass">

                <small>Average KPI</small>

                <h2 id="averageKPI">

                    ...

                </h2>

            </div>

        </div>

    </div>

    <!-- CHART -->

    <div class="card-glass mt-4">

        <h5 class="mb-3">

            Grafik KPI

        </h5>

        <canvas id="chartKPI" height="100"></canvas>

    </div>

    <!-- API STATUS -->

    <div class="card-glass mt-4">

        <h5>

            Status API

        </h5>

        <p id="apiStatus">

            Menghubungkan...

        </p>

    </div>

</div>

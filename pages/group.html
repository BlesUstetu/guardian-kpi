<div class="container-fluid">

    <!-- =======================================
         HEADER
    ======================================== -->

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>

            <h2 class="fw-bold text-info">

                Data Group

            </h2>

            <small class="text-secondary">

                Kelola seluruh data group security.

            </small>

        </div>

        <button
            class="btn btn-info"
            onclick="openGroupModal()">

            <i class="bi bi-plus-circle"></i>

            Tambah Group

        </button>

    </div>

    <!-- =======================================
         CARD
    ======================================== -->

    <div class="card-glass">

        <!-- Toolbar -->

        <div class="row mb-3">

            <div class="col-md-6">

                <input
                    id="searchGroup"
                    type="text"
                    class="form-control"
                    placeholder="Cari Nama Group..."
                    onkeyup="filterGroup()">

            </div>

            <div class="col-md-3">

                <select
                    id="filterStatusGroup"
                    class="form-select"
                    onchange="filterGroup()">

                    <option value="">
                        Semua Status
                    </option>

                    <option value="Aktif">
                        Aktif
                    </option>

                    <option value="Nonaktif">
                        Nonaktif
                    </option>

                </select>

            </div>

            <div class="col-md-3 text-end">

                <button
                    class="btn btn-outline-info"
                    onclick="refreshGroup()">

                    <i class="bi bi-arrow-clockwise"></i>

                    Refresh

                </button>

            </div>

        </div>

        <!-- Table -->

        <div class="table-responsive">

            <table class="table table-dark table-hover align-middle">

                <thead>

                    <tr>

                        <th width="120">
                            ID
                        </th>

                        <th>
                            Nama Group
                        </th>

                        <th width="150">
                            Status
                        </th>

                        <th width="150">
                            Aksi
                        </th>

                    </tr>

                </thead>

                <tbody id="tblGroup">

                    <tr>

                        <td colspan="4" class="text-center">

                            Memuat data...

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

<!-- =======================================
     MODAL GROUP
======================================= -->

<div
    class="modal fade"
    id="groupModal"
    tabindex="-1">

    <div class="modal-dialog">

        <div class="modal-content bg-dark text-white">

            <div class="modal-header">

                <h5 class="modal-title">

                    Data Group

                </h5>

                <button
                    class="btn-close btn-close-white"
                    data-bs-dismiss="modal">

                </button>

            </div>

            <div class="modal-body">

                <div class="mb-3">

                    <label class="form-label">

                        Nama Group

                    </label>

                    <input
                        id="namaGroup"
                        type="text"
                        class="form-control"
                        placeholder="Contoh : Group 1">

                </div>

                <div class="mb-3">

                    <label class="form-label">

                        Status

                    </label>

                    <select
                        id="statusGroup"
                        class="form-select">

                        <option value="Aktif">

                            Aktif

                        </option>

                        <option value="Nonaktif">

                            Nonaktif

                        </option>

                    </select>

                </div>

            </div>

            <div class="modal-footer">

                <button
                    class="btn btn-secondary"
                    data-bs-dismiss="modal">

                    Batal

                </button>

                <button
                    class="btn btn-info"
                    onclick="saveGroup()">

                    Simpan

                </button>

            </div>

        </div>

    </div>

</div>

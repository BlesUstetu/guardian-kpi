<div class="container-fluid">

    <!-- =======================================
         HEADER
    ======================================== -->

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>

            <h2 class="fw-bold text-info">

                Master KPI

            </h2>

            <small class="text-secondary">

                Kelola Indicator KPI Security.

            </small>

        </div>

        <button
            class="btn btn-info"
            onclick="openMasterKPIModal()">

            <i class="bi bi-plus-circle"></i>

            Tambah Indicator

        </button>

    </div>

    <!-- =======================================
         CARD
    ======================================== -->

    <div class="card-glass">

        <div class="row mb-3">

            <div class="col-md-5">

                <input
                    id="searchMasterKPI"
                    type="text"
                    class="form-control"
                    placeholder="Cari Indicator..."
                    onkeyup="filterMasterKPI()">

            </div>

            <div class="col-md-3">

                <select
                    id="filterKategori"
                    class="form-select"
                    onchange="filterMasterKPI()">

                    <option value="">

                        Semua Kategori

                    </option>

                    <option value="Disiplin">

                        Disiplin

                    </option>

                    <option value="Operasional">

                        Operasional

                    </option>

                    <option value="Administrasi">

                        Administrasi

                    </option>

                </select>

            </div>

            <div class="col-md-4 text-end">

                <button
                    class="btn btn-outline-info"
                    onclick="refreshMasterKPI()">

                    <i class="bi bi-arrow-clockwise"></i>

                    Refresh

                </button>

            </div>

        </div>

        <div class="table-responsive">

            <table class="table table-dark table-hover align-middle">

                <thead>

                    <tr>

                        <th width="90">

                            ID

                        </th>

                        <th>

                            Indicator

                        </th>

                        <th width="180">

                            Kategori

                        </th>

                        <th width="90">

                            Bobot

                        </th>

                        <th width="90">

                            Target

                        </th>

                        <th width="120">

                            Status

                        </th>

                        <th width="150">

                            Aksi

                        </th>

                    </tr>

                </thead>

                <tbody id="tblMasterKPI">

                    <tr>

                        <td colspan="7" class="text-center">

                            Memuat data...

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

<!-- =======================================
     MODAL MASTER KPI
======================================= -->

<div
class="modal fade"
id="masterKPIModal"
tabindex="-1"
data-bs-backdrop="static">

<div class="modal-dialog">

<div class="modal-content bg-dark text-white">

<div class="modal-header">

<h5 class="modal-title">

Master KPI

</h5>

<button
class="btn-close btn-close-white"
data-bs-dismiss="modal">

</button>

</div>

<div class="modal-body">

<!-- Indicator -->

<div class="mb-3">

<label class="form-label">

Indicator

</label>

<input
id="indicatorKPI"
type="text"
class="form-control"
maxlength="50"
placeholder="Masukkan Indicator KPI">

</div>

<!-- Kategori -->

<div class="mb-3">

<label class="form-label">

Kategori

</label>

<select
id="kategoriKPI"
class="form-select">

<option value="">

Pilih Kategori

</option>

<option value="Disiplin">

Disiplin

</option>

<option value="Operasional">

Operasional

</option>

<option value="Administrasi">

Administrasi

</option>

</select>

</div>

<!-- Bobot -->

<div class="mb-3">

<label class="form-label">

Bobot (%)

</label>

<input
id="bobotKPI"
type="number"
class="form-control"
min="1"
max="100"
placeholder="0">

</div>

<!-- Target -->

<div class="mb-3">

<label class="form-label">

Target (%)

</label>

<input
id="targetKPI"
type="number"
class="form-control"
min="0"
max="100"
value="100">

</div>

<!-- Status -->

<div class="mb-3">

<label class="form-label">

Status

</label>

<select
id="statusKPI"
class="form-select">

<option value="Aktif">

Aktif

</option>

<option value="Nonaktif">

Nonaktif

</option>

</select>

</div>

</div>

<div class="modal-footer">

<button
class="btn btn-secondary"
data-bs-dismiss="modal">

Batal

</button>

<button
id="btnSaveMasterKPI"
class="btn btn-info"
onclick="saveMasterKPI()">

<i class="bi bi-save"></i>

Simpan

</button>

</div>

</div>

</div>

</div>

<!DOCTYPE html>
<html lang="id" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Guardian KPI Web3</title>

    <link rel="stylesheet" href="css/style.css">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>

<body>

<div class="app-shell">

    <!-- ==================================================
         SIDEBAR
    ================================================== -->
    <aside class="sidebar" id="mainSidebar">

        <div class="sidebar-brand">

            <div class="brand-mark">
                <i class="bi bi-shield-check"></i>
            </div>

            <div>
                <div class="brand-title">
                    Guardian <span>KPI</span>
                </div>

                <div class="brand-subtitle">
                    Enterprise Security
                </div>
            </div>

        </div>

        <nav class="menu" aria-label="Menu utama">

            <a
                href="#"
                class="menu-item active"
                data-page="dashboard"
                onclick="event.preventDefault(); loadPage('dashboard');">

                <span class="menu-icon">
                    <i class="bi bi-speedometer2"></i>
                </span>

                <span class="menu-label">
                    Dashboard
                </span>

            </a>

            <a
                href="#"
                class="menu-item"
                data-page="setting"
                onclick="event.preventDefault(); requestSettingsAccess();">

                <span class="menu-icon">
                    <i class="bi bi-gear-fill"></i>
                </span>

                <span class="menu-label">
                    Settings
                </span>

                <span class="menu-lock">
                    <i class="bi bi-lock-fill"></i>
                </span>

            </a>

        </nav>

        <div class="sidebar-footer">

            <div class="sidebar-status">
                <span class="status-dot"></span>
                System Online
            </div>

            <small>
                Guardian KPI Web3
            </small>

        </div>

    </aside>


    <!-- ==================================================
         MAIN
    ================================================== -->
    <main class="main-shell">

        <header class="topbar">

            <div class="topbar-title">

                <button
                    type="button"
                    class="mobile-menu-button"
                    onclick="toggleSidebar()"
                    aria-label="Buka menu">

                    <i class="bi bi-list"></i>

                </button>

                <div>

                    <h3 id="pageTitle">
                        Dashboard
                    </h3>

                    <small id="pageSubtitle">
                        Guardian KPI Web3
                    </small>

                </div>

            </div>


            <!-- GLOBAL DARK / LIGHT TOGGLE -->

            <div class="topbar-actions">

                <span
                    id="themeLabel"
                    class="theme-label">
                    Dark
                </span>

                <button
                    id="themeToggle"
                    type="button"
                    class="theme-toggle"
                    aria-label="Ubah Dark / Light Mode"
                    aria-pressed="false"
                    title="Ubah Dark / Light Mode"
                    onclick="toggleTheme()">

                    <span class="theme-icon theme-icon-sun">
                        <i class="bi bi-sun-fill"></i>
                    </span>

                    <span class="theme-switch-track">

                        <span
                            id="themeSwitchKnob"
                            class="theme-switch-knob">
                        </span>

                    </span>

                    <span class="theme-icon theme-icon-moon">
                        <i class="bi bi-moon-stars-fill"></i>
                    </span>

                </button>

            </div>

        </header>


        <section
            id="appContent"
            class="app-content">

            <div class="page-loading">

                <div class="spinner-border text-info"></div>

                <p>
                    Loading...
                </p>

            </div>

        </section>

    </main>

</div>


<!-- ======================================================
     SETTINGS PIN MODAL
====================================================== -->

<div
    class="modal fade"
    id="settingsPinModal"
    tabindex="-1"
    aria-hidden="true">

    <div class="modal-dialog modal-dialog-centered">

        <div class="modal-content settings-pin-modal">

            <div class="modal-header">

                <div>

                    <div class="settings-lock-icon">
                        <i class="bi bi-shield-lock-fill"></i>
                    </div>

                    <h5
                        id="settingsPinTitle"
                        class="modal-title mt-3">
                        Settings Terkunci
                    </h5>

                </div>

                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal"
                    aria-label="Close">
                </button>

            </div>


            <div class="modal-body">

                <p
                    id="settingsPinMessage"
                    class="text-secondary">
                    Masukkan PIN untuk membuka Settings.
                </p>


                <!-- CREATE PIN -->

                <div
                    id="settingsCreatePinGroup"
                    class="d-none">

                    <label
                        for="settingsNewPin"
                        class="form-label">
                        Buat PIN
                    </label>

                    <input
                        id="settingsNewPin"
                        type="password"
                        class="form-control"
                        inputmode="numeric"
                        autocomplete="new-password"
                        maxlength="12"
                        placeholder="4–12 digit">


                    <label
                        for="settingsConfirmPin"
                        class="form-label mt-3">
                        Konfirmasi PIN
                    </label>

                    <input
                        id="settingsConfirmPin"
                        type="password"
                        class="form-control"
                        inputmode="numeric"
                        autocomplete="new-password"
                        maxlength="12"
                        placeholder="Ulangi PIN">

                </div>


                <!-- ENTER PIN -->

                <div id="settingsEnterPinGroup">

                    <label
                        for="settingsPinInput"
                        class="form-label">
                        PIN Settings
                    </label>

                    <input
                        id="settingsPinInput"
                        type="password"
                        class="form-control"
                        inputmode="numeric"
                        autocomplete="current-password"
                        maxlength="12"
                        placeholder="Masukkan PIN">

                </div>


                <div
                    id="settingsPinError"
                    class="settings-pin-error d-none">
                </div>

            </div>


            <div class="modal-footer">

                <button
                    type="button"
                    class="btn btn-secondary"
                    data-bs-dismiss="modal">
                    Batal
                </button>

                <button
                    id="settingsPinSubmit"
                    type="button"
                    class="btn btn-info"
                    onclick="submitSettingsAccess()">
                    Buka Settings
                </button>

            </div>

        </div>

    </div>

</div>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

<script src="js/config.js"></script>
<script src="js/api.js"></script>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script src="js/dashboard.js"></script>

<script src="js/anggota.js"></script>
<script src="js/group.js"></script>
<script src="js/masterkpi.js"></script>
<script src="js/penilaian.js"></script>

<script src="js/app.js"></script>

</body>
</html>

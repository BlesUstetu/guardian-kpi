<!DOCTYPE html>
<html lang="id" data-theme="dark">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Guardian KPI</title>


    <!-- Bootstrap -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <!-- Bootstrap Icons -->

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">


    <!-- Guardian KPI UI -->

    <link
        rel="stylesheet"
        href="css/style.css">

</head>


<body>


<!-- ======================================================
     APPLICATION
====================================================== -->

<div id="guardianApp">


    <!-- ==================================================
         TOP BAR
    ================================================== -->

    <header class="guardian-topbar">


        <!-- ================================
             LEFT MENU
        ================================= -->

        <div class="topbar-left">


            <!-- HAMBURGER -->

            <div class="menu-wrapper">


                <button
                    id="menuButton"
                    type="button"
                    class="icon-button menu-button"
                    aria-label="Menu"
                    aria-expanded="false"
                    title="Menu">

                    <i class="bi bi-list"></i>

                </button>


                <!-- ==========================
                     DROPDOWN MENU
                =========================== -->

                <div
                    id="mainMenu"
                    class="main-menu"
                    aria-hidden="true">


                    <!-- DASHBOARD -->

                    <button
                        type="button"
                        class="main-menu-item active"
                        data-page="dashboard">

                        <span class="main-menu-icon">

                            <i class="bi bi-speedometer2"></i>

                        </span>

                        <span>
                            Dashboard
                        </span>

                    </button>


                    <!-- SETTINGS -->

                    <button
                        type="button"
                        class="main-menu-item"
                        data-page="setting">

                        <span class="main-menu-icon">

                            <i class="bi bi-gear"></i>

                        </span>

                        <span>
                            Settings
                        </span>

                        <span class="main-menu-lock">

                            <i class="bi bi-lock-fill"></i>

                        </span>

                    </button>


                </div>

            </div>


        </div>


        <!-- ==================================================
             RIGHT SIDE
             SINGLE THEME ICON
        ================================================== -->

        <div class="topbar-right">


            <button
                id="themeToggle"
                type="button"
                class="theme-icon-button"
                aria-label="Ubah tema"
                title="Ubah tema">

                <i
                    id="themeIcon"
                    class="bi bi-moon-stars-fill">
                </i>

            </button>


        </div>


    </header>


    <!-- ==================================================
         MAIN CONTENT
    ================================================== -->

    <main
        id="appContent"
        class="guardian-content">


        <div class="initial-loading">

            <div class="spinner-border"></div>

        </div>


    </main>


</div>


<!-- ======================================================
     SETTINGS PIN MODAL
====================================================== -->

<div
    class="modal fade"
    id="settingsPinModal"
    tabindex="-1"
    aria-hidden="true">


    <div
        class="modal-dialog modal-dialog-centered">


        <div class="modal-content guardian-pin-modal">


            <!-- HEADER -->

            <div class="modal-header">


                <div>

                    <div class="pin-icon">

                        <i class="bi bi-shield-lock-fill"></i>

                    </div>


                    <h5
                        id="settingsPinTitle"
                        class="modal-title mt-3">

                        Settings Terkunci

                    </h5>

                </div>


                <button
                    type="button"
                    class="btn-close guardian-close"
                    data-bs-dismiss="modal"
                    aria-label="Close">
                </button>


            </div>


            <!-- BODY -->

            <div class="modal-body">


                <p
                    id="settingsPinMessage"
                    class="pin-message">

                    Masukkan PIN untuk membuka Settings.

                </p>


                <!-- CREATE PIN -->

                <div
                    id="settingsCreatePinGroup"
                    class="d-none">


                    <label
                        for="settingsNewPin"
                        class="guardian-label">

                        Buat PIN

                    </label>


                    <input
                        id="settingsNewPin"
                        type="password"
                        class="guardian-input"
                        inputmode="numeric"
                        autocomplete="new-password"
                        maxlength="12"
                        placeholder="4–12 digit">


                    <label
                        for="settingsConfirmPin"
                        class="guardian-label mt-3">

                        Konfirmasi PIN

                    </label>


                    <input
                        id="settingsConfirmPin"
                        type="password"
                        class="guardian-input"
                        inputmode="numeric"
                        autocomplete="new-password"
                        maxlength="12"
                        placeholder="Ulangi PIN">


                </div>


                <!-- ENTER PIN -->

                <div
                    id="settingsEnterPinGroup">


                    <label
                        for="settingsPinInput"
                        class="guardian-label">

                        PIN Settings

                    </label>


                    <input
                        id="settingsPinInput"
                        type="password"
                        class="guardian-input"
                        inputmode="numeric"
                        autocomplete="current-password"
                        maxlength="12"
                        placeholder="Masukkan PIN">


                </div>


                <!-- ERROR -->

                <div
                    id="settingsPinError"
                    class="pin-error d-none">
                </div>


            </div>


            <!-- FOOTER -->

            <div class="modal-footer">


                <button
                    type="button"
                    class="guardian-secondary-button"
                    data-bs-dismiss="modal">

                    Batal

                </button>


                <button
                    id="settingsPinSubmit"
                    type="button"
                    class="guardian-primary-button">

                    Buka Settings

                </button>


            </div>


        </div>


    </div>


</div>


<!-- ======================================================
     LIBRARIES
====================================================== -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


<script
    src="https://cdn.jsdelivr.net/npm/chart.js">
</script>


<!-- ======================================================
     PROJECT JAVASCRIPT
====================================================== -->

<script src="js/config.js"></script>

<script src="js/api.js"></script>

<script src="js/dashboard.js"></script>

<script src="js/anggota.js"></script>

<script src="js/group.js"></script>

<script src="js/masterkpi.js"></script>

<script src="js/penilaian.js"></script>

<script src="js/app.js"></script>


</body>

</html>
